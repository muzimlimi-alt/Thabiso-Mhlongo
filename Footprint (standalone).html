document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --f-display: 'Cormorant Garamond', Georgia, serif; /* @kind font */\n  --f-body:    'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; /* @kind font */\n  --f-mono:    'JetBrains Mono', monospace; /* @kind font */\n\n  /* Fluid type scale (restrained, editorial) — sizes, not font-families */\n  --fs-xs:   0.7rem; /* @kind other */\n  --fs-sm:   0.82rem; /* @kind other */\n  --fs-base: clamp(0.95rem, 0.92rem + 0.15vw, 1rem); /* @kind other */\n  --fs-lg:   clamp(1.05rem, 1rem + 0.25vw, 1.15rem); /* @kind other */\n  --fs-xl:   clamp(1.25rem, 1.15rem + 0.5vw, 1.5rem); /* @kind other */\n  --h4:      clamp(1.1rem, 1rem + 0.6vw, 1.4rem); /* @kind other */\n  --h3:      clamp(1.4rem, 1.2rem + 1vw, 2rem); /* @kind other */\n  --h2:      clamp(1.9rem, 1.4rem + 2vw, 3rem); /* @kind other */\n  --h1:      clamp(2.4rem, 1.8rem + 3.2vw, 4.2rem); /* @kind other */\n  --display: clamp(2.8rem, 2rem + 4.5vw, 5.5rem); /* @kind other */\n\n  /* Eyebrow / label style */\n  --eyebrow-tracking: .3em; /* @kind other */\n  --eyebrow-size: .7rem; /* @kind other */\n}\n\nbody {\n  font-family: var(--f-body);\n  font-weight: 300;\n  font-size: var(--fs-base);\n  line-height: 1.7;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--f-display);\n  font-weight: 400;\n  line-height: 1.15;\n  letter-spacing: -.005em;\n  margin: 0 0 .6em;\n}\nh1 { font-size: var(--h1); }\nh2 { font-size: var(--h2); }\nh3 { font-size: var(--h3); }\nh4 { font-size: var(--h4); }\n\n/* Italic emphasis inside headings = gold, brand signature move */\nh1 em, h2 em, h3 em {\n  font-style: italic;\n  color: var(--y-base);\n  font-weight: 400;\n}\n\np { margin: 0 0 1em; font-weight: 300; }\n\n/* Eyebrow label — small tracked-out uppercase gold kicker above headings */\n.eyebrow {\n  display: inline-block;\n  font-family: var(--f-body);\n  font-weight: 400;\n  font-size: var(--eyebrow-size);\n  letter-spacing: var(--eyebrow-tracking);\n  text-transform: uppercase;\n  color: var(--y-base);\n  margin-bottom: .85rem;\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   SPACING, RADIUS, SHADOW, MOTION TOKENS — Thabiso Mhlongo Design System\n   Radius is deliberately near-flat (2–8px) — a sharp, editorial-luxe grid,\n   not a soft/rounded app UI. Shadows are restrained, near-black, low-opacity.\n   ========================================================================== */\n\n:root {\n  /* Spacing scale */\n  --sp-1: 4px;\n  --sp-2: 8px;\n  --sp-3: 12px;\n  --sp-4: 16px;\n  --sp-5: 24px;\n  --sp-6: 32px;\n  --sp-7: 48px;\n  --sp-8: 64px;\n  --sp-9: 96px;\n\n  /* Layout */\n  --container: 1280px;\n  --container-narrow: 960px;\n  --gutter: clamp(20px, 4vw, 32px); /* @kind spacing */\n  --header-h: 72px;\n  --announce-h: 36px;\n\n  /* Section vertical rhythm */\n  --section-pad: 56px;\n  --section-pad-md: 67px;\n  --section-pad-lg: 78px;\n\n  /* Radius — minimal, sharp; never snap to a 4/8 grid default, these ARE the brand's exact values */\n  --r:      2px;  /* default — buttons, inputs, cards */\n  --r-md:   4px;\n  --r-lg:   8px;  /* used sparingly, e.g. admin-only surfaces */\n  --r-pill: 999px; /* pills/badges only */\n\n  /* Shadow — restrained, warm-black, low opacity */\n  --sh-xs: 0 1px 2px rgba(26,22,18,.04);\n  --sh-sm: 0 1px 3px rgba(26,22,18,.06);\n  --sh-md: 0 4px 20px rgba(26,22,18,.08);\n  --sh-lg: 0 8px 40px rgba(26,22,18,.12);\n  --sh-xl: 0 20px 60px rgba(26,22,18,.18);\n\n  /* Motion */\n  --ease:      cubic-bezier(0.25, 0.46, 0.45, 0.94); /* @kind other */\n  --ease-out:  cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --t:         0.35s; /* @kind other */\n  --t-slow:    0.6s; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   BASE / RESET — Thabiso Mhlongo Design System\n   ========================================================================== */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml {\n  font-size: 16px;\n  scroll-behavior: smooth;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }\n}\n\nbody {\n  color: var(--text-primary);\n  background: var(--bg-page);\n  margin: 0;\n}\n\nimg { max-width: 100%; height: auto; display: block; }\n\na { color: var(--y-base); text-decoration: none; transition: color var(--t) var(--ease); }\na:hover, a:focus { color: var(--y-hover); }\n\n::selection { background: var(--y-muted); color: var(--text-primary); }\n\n:focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 3px;\n  border-radius: var(--r);\n}\n\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-track { background: var(--bg-page); }\n::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 8px; border: 2px solid var(--bg-page); }\n::-webkit-scrollbar-thumb:hover { background: var(--y-base); }\n<\u002Fstyle>\n  <style>/* Thabiso Mhlongo Design System — global stylesheet entry point.\n   List-of-imports only; do not add rules here. */\n/* ==========================================================================\n   COLOR TOKENS — Thabiso Mhlongo Design System\n   \"Obsidian & Gold\" — dark editorial base, warm gold accent.\n   Source: css/redesign.css (:root block), Thabiso Mhlongo Official Website.\n   ========================================================================== */\n\n:root {\n  /* -- Background layers (depth & hierarchy) -- */\n  --bg-page:     #0a0a0a; /* darkest — main page background */\n  --bg-section:  #111111; /* subtle section separation */\n  --bg-surface:  #1a1a1a; /* card / surface background */\n  --bg-elevated: #242424; /* hover / elevated states, inputs */\n  --bg-glass:    rgba(20, 20, 20, 0.7);\n\n  /* -- Brand gold (primary) -- */\n  --y-base:  #D4AF37; /* primary gold — CTAs, links, accents */\n  --y-hover: #E8C14B; /* brighter gold — hover/interaction */\n  --y-light: #F4E4B5; /* soft gold — subtle backgrounds/text */\n  --y-dark:  #9A7B2C; /* deep gold — borders/contrast */\n  --y-muted: rgba(212, 175, 55, 0.15); /* translucent gold wash */\n  --y-glow:  rgba(212, 175, 55, 0.3);  /* glows & button shadows */\n\n  /* -- Text -- */\n  --text-primary:   #ffffff;\n  --text-secondary: #b0b0b0;\n  --text-muted:     #707070;\n  --text-inverse:   #0a0a0a; /* dark text on gold buttons */\n\n  /* -- Controlled accent palette (status colour, not brand colour) -- */\n  --accent-red:   #f87171;\n  --accent-gold:  #c9a96e;\n  --accent-green: #4ade80;\n  --accent-blue:  #60a5fa;\n\n  /* -- Semantic / system -- */\n  --success: #10b981;\n  --error:   #ef4444;\n  --warning: #f59e0b;\n  --info:    #3b82f6;\n\n  /* -- Borders & dividers (white-alpha, on dark bg) -- */\n  --border-low:     rgba(255, 255, 255, 0.08);\n  --border-default: rgba(255, 255, 255, 0.15);\n  --border-strong:  rgba(255, 255, 255, 0.3);\n\n  /* -- Semantic aliases used across components -- */\n  --surface-page:     var(--bg-page);\n  --surface-section:  var(--bg-section);\n  --surface-card:     var(--bg-surface);\n  --surface-elevated: var(--bg-elevated);\n  --text-body:        var(--text-secondary);\n  --text-heading:     var(--text-primary);\n  --border-card:      var(--border-low);\n  --focus-ring:       var(--y-base);\n}\n\n/* ==========================================================================\n   TYPE TOKENS — Thabiso Mhlongo Design System\n   Display: Cormorant Garamond (serif, editorial, italic accents)\n   Body:    Outfit (geometric sans, light weights)\n   Mono:    JetBrains Mono (dates, numerals, code-like meta)\n   Source: css/redesign.css @impor tainer-narrow: 960px;\n  --gutter: clamp(20px, 4vw, 32px); /* @kind spacing */\n  --header-h: 72px;\n  --announce-h: 36px;\n\n  /* Section vertical rhythm */\n  --section-pad: 56px;\n  --section-pad-md: 67px;\n  --section-pad-lg: 78px;\n\n  /* Radius — minimal, sharp; never snap to a 4/8 grid default, these ARE the brand's exact values */\n  --r:      2px;  /* default — buttons, inputs, cards */\n  --r-md:   4px;\n  --r-lg:   8px;  /* used sparingly, e.g. admin-only surfaces */\n  --r-pill: 999px; /* pills/badges only */\n\n  /* Shadow — restrained, warm-black, low opacity */\n  --sh-xs: 0 1px 2px rgba(26,22,18,.04);\n  --sh-sm: 0 1px 3px rgba(26,22,18,.06);\n  --sh-md: 0 4px 20px rgba(26,22,18,.08);\n  --sh-lg: 0 8px 40px rgba(26,22,18,.12);\n  --sh-xl: 0 20px 60px rgba(26,22,18,.18);\n\n  /* Motion */\n  --ease:      cubic-bezier(0.25, 0.46, 0.45, 0.94); /* @kind other */\n  --ease-out:  cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --t:         0.35s; /* @kind other */\n  --t-slow:    0.6s; /* @kind other */\n}\n\n/* ==========================================================================\n   BASE / RESET — Thabiso Mhlongo Design System\n   ========================================================================== */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml {\n  font-size: 16px;\n  scroll-behavior: smooth;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }\n}\n\nbody {\n  color: var(--text-primary);\n  background: var(--bg-page);\n  margin: 0;\n}\n\nimg { max-width: 100%; height: auto; display: block; }\n\na { color: var(--y-base); text-decoration: none; transition: color var(--t) var(--ease); }\na:hover, a:focus { color: var(--y-hover); }\n\n::selection { background: var(--y-muted); color: var(--text-primary); }\n\n:foc order-color 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);\" style-hover=\"border-color: var(--y-base); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(26, 22, 18, 0.18);\">\n          <div style=\"overflow: hidden;\"><img class=\"fp-flag\" src=\"13751058-c9e4-41b2-840a-83ef9137f483\" alt=\"Flag of Spain\" style=\"display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover;\"><\u002Fdiv>\n          <p class=\"fp-name\" style=\"margin: 0; padding: 14px 16px; font-family: var(--f-body); font-weight: 400; font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-secondary);\">Spain<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"fp-card\" style=\"background: var(--bg-surface); border: 1px solid var(--border-low); border-radius: 2px; overflow: hidden; transition: border-color 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);\" style-hover=\"border-color: var(--y-base); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(26, 22, 18, 0.18);\">\n          <div style=\"overflow: hidden;\"><img class=\"fp-flag\" src=\"54d42567-1aa7-42a5-9925-c72dd4298a7b\" alt=\"Flag of Japan\" style=\"display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover;\"><\u002Fdiv>\n          <p class=\"fp-name\" style=\"margin: 0; padding: 14px 16px; font-family: var(--f-body); font-weight: 400; font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-secondary);\">Japan<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;showNames&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;:
