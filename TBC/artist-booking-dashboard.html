<style>
  :root {
    --paper: #f4efe6;
    --card: #fbf8f1;
    --ink: #1c1814;
    --muted: #6b6359;
    --line: #ddd3c2;
    --amber: #b8612f;
    --sage: #4f6248;
    --clay: #9a3f31;
    --focus: #1c1814;
  }
  * { box-sizing: border-box; }
  body {
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(184,97,47,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(79,98,72,0.05), transparent 45%);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
  }
  /* Visible, high-contrast focus ring on every interactive element (WCAG 2.4.7) */
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible,
  textarea:focus-visible, [role="switch"]:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  /* Skip link */
  .skip-link {
    position: absolute; left: 8px; top: -60px; z-index: 100;
    background: var(--ink); color: var(--card); padding: 10px 16px;
    border-radius: 6px; transition: top .15s ease; font-weight: 600;
  }
  .skip-link:focus { top: 8px; }
  /* Collapse animation */
  .detail-region {
    overflow: hidden;
    max-height: 0;
    transition: max-height .35s cubic-bezier(.4,0,.2,1);
  }
  .detail-region.open { max-height: 4000px; }
  .chevron { transition: transform .3s ease; }
  .chevron.open { transform: rotate(180deg); }
  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(28,24,20,0.55);
    backdrop-filter: blur(3px);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 5vh 16px; overflow-y: auto;
  }
  .modal-overlay[hidden] { display: none; }
  @keyframes modalIn { from { opacity:0; transform: translateY(16px) scale(.98);} to {opacity:1; transform:none;} }
  .modal-panel { animation: modalIn .25s cubic-bezier(.2,.8,.2,1); }
  @keyframes cardIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }
  .booking-card { animation: cardIn .4s ease backwards; }
  /* Accessible toggle switch */
  .switch {
    position: relative; width: 52px; height: 28px; border-radius: 999px;
    background: var(--line); border: 1px solid var(--line); cursor: pointer;
    transition: background .2s ease; flex-shrink: 0;
  }
  .switch[aria-checked="true"] { background: var(--sage); }
  .switch::after {
    content:""; position:absolute; top:2px; left:2px; width:22px; height:22px;
    border-radius:999px; background:#fff; transition: transform .2s ease;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .switch[aria-checked="true"]::after { transform: translateX(24px); }
  /* Status pills with patterned dots (not color-only) */
  .pill-dot { width: 9px; height: 9px; border-radius: 50%; display:inline-block; flex-shrink:0; }
  .spinner {
    width: 22px; height: 22px; border: 3px solid var(--line);
    border-top-color: var(--amber); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  table { border-collapse: collapse; }
  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  .grain {
    pointer-events:none; position:fixed; inset:0; z-index:0; opacity:.025;

/* =========================================================================
   MONEY HELPERS (§2)
   ========================================================================= */
function computeTotals(lineItems, discountCents = 0, vatOn = true) {
  const subtotal = lineItems.reduce((s,li)=> s + li.qty * li.unitPrice, 0);
  const discounted = Math.max(0, subtotal - discountCents);
  const vat = vatOn ? Math.round(0.15 * discounted) : 0;
  const total = discounted + vat;
  return { subtotal, discount: discountCents, vat, total };
}
function bookingTotal(b) {
  if (b.quotedAmount) return b.quotedAmount;
  return computeTotals(b.lineItems).total;
}
function outstanding(b) {
  return Math.max(0, bookingTotal(b) - b.amountPaid);
}

   MOCK API (§1) — single wrapper
   ========================================================================= */

  console.log('[mockApi] →', endpoint, payload);
  return new Promise((resolve) => {
    setTimeout(() => {

      resolve({ ok:true, endpoint, payload });
    }, delayMs);
  });
}

/* =========================================================================
   STATE MUTATORS (§1)
   ========================================================================= */
function updateBooking(id, patch) {
  const i = state.bookings.findIndex(b => b.id === id);
  if (i === -1) return;
  state.bookings[i] = { ...state.bookings[i], ...patch };
  delete state.detailCache[id]; // detail may have changed
  render();
}
function announce(msg) {
  document.getElementById('liveRegion').textContent = msg;
}

/* =========================================================================
   FILTERING (§4)
   ========================================================================= */
function visibleBookings() {
  return state.bookings.filter(b => {
    if (state.filters.status && b.status !== state.filters.status) return false;
    if (state.filters.payment !== 'All' && b.paymentStatus !== state.filters.payment) return false;
    return true;
  });
}

  const m = STATUS_META[status];
  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold"
    style="background:${m.tint}; color:${m.color}">
    <span class="pill-dot" style="background:${m.color}"></span>${m.label}</span>`;
}
function paymentBadge(p) {
  const m = PAYMENT_META[p];
  const icon = p==='PAID' ? '✓' : p==='FAILED' ? '✕' : p==='DEPOSIT_PAID' ? '◐' : '○';
  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border" style="border-color:var(--line); color:var(--muted)">
    <span aria-hidden="true">${icon}</span>${m.label}</span>`;
}
function tagBadge(text, icon) {
  return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold" style="background:var(--ink); color:var(--paper)">
    <span aria-hidden="true">${icon}</span>${text}</span>`;
}

function renderStatsPills() {
  const counts = {};
  Object.keys(STATUS_META).forEach(s => counts[s] = 0);
  state.bookings.forEach(b => counts[b.status]++);
  const wrap = document.getElementById('statsPills');
  wrap.innerHTML = Object.entries(STATUS_META).map(([key,m]) => {
    const active = state.filters.status === key;
    return `<button type="button" data-status="${key}"
      aria-pressed="${active}"
      class="stat-pill inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-semibold border transition-all"
      style="border-color:${active?m.color:'var(--line)'}; background:${active?m.tint:'var(--card)'}; color:${active?m.color:'var(--ink)'}">
      <span class="pill-dot" style="background:${m.color}"></span>
      ${m.label}
      <span class="px-1.5 py-0.5 rounded-md text-xs" style="background:${active?'#fff':'var(--paper)'}">${counts[key]}</span>
    </button>`;
  }).join('');
}

function actionBtn(label, action, id, variant='ghost') {
  const styles = {
    primary: 'background:var(--ink); color:var(--paper); border-color:var(--ink)',
    ghost:   'background:transparent; color:var(--ink); border-color:var(--line)',
    danger:  'background:transparent; color:var(--clay); border-color:var(--clay)',
  };
  return `<button type="button" data-action="${action}" data-id="${id}"
    class="action-btn px-3 py-1.5 text-xs font-semibold rounded-lg border transition-all hover:-translate-y-px"
    style="${styles[variant]}">${label}</button>`;
}

function headerActions(b) {
  // An invoice can be generated once a quote exists and none has been made yet.
  const canInvoice = !b.invoiceExists && b.quotedAmount > 0 && b.status !== 'CANCELLED';
  if (b.status === 'CANCELLED' || b.status === 'COMPLETED') {
    // terminal: still allow viewing/contract/delete
    const parts = [];
    if (canInvoice) parts.push(actionBtn('Generate invoice','invoice',b.id));
    parts.push(actionBtn('Contract','contract',b.id));
    parts.push(actionBtn('Full details','details',b.id));
    parts.push(actionBtn('Delete','delete',b.id,'danger'));
    return parts.join('');
  }
  const map = {
    PENDING:   [['Send quote','quote','primary'],['Cancel','cancel','danger']],
    QUOTED:    [['Accept booking','accept','primary'],['Cancel','cancel','danger']],
    ACCEPTED:  [['Confirm','confirm','primary'],['Record payment','payment','ghost'],['Cancel','cancel','danger']],
    CONFIRMED: [['Mark complete','complete','primary'],['Record payment','payment','ghost'],['Cancel','cancel','danger']],
  };
  const parts = (map[b.status]||[]).map(([l,a,v]) => actionBtn(l,a,b.id,v));
  if (canInvoice) parts.push(actionBtn('Generate invoice','invoice',b.id));
  parts.push(actionBtn('Contract','contract',b.id));
  parts.push(actionBtn('Full details','details',b.id));
  parts.push(actionBtn('Delete','delete',b.id,'danger'));
  return parts.join('');
}

function renderList() {

  const items = visibleBookings();
  const count = document.getElementById('resultCount');

/* =========================================================================

   ========================================================================= */
async function toggleExpand(id) {
  if (state.expandedId === id) {
    state.expandedId = null;
    render();
    return;
  }
  state.expandedId = id;
  render();

  if (!state.detailCache[id]) {
    const region = document.getElementById('detail-'+id);
    const inner = region.querySelector('.detail-inner');
    region.setAttribute('aria-busy','true');
    const b = state.bookings.find(x=>x.id===id);
    await mockApi(`/api/admin/bookings/${id}/detail`);
    state.detailCache[id] = buildDetailHTML(b);
    if (state.expandedId === id) {
      inner.innerHTML = state.detailCache[id];
      region.setAttribute('aria-busy','false');
      announce(`Details loaded for ${b.event}.`);
      // move focus to the detail region heading for screen readers
      region.setAttribute('tabindex','-1');
      region.focus({preventScroll:true});
    }
  }
}

/* =========================================================================
   MODALS — focus trap, Escape, focus restore (§3, §4)
   ========================================================================= */
let lastFocused = null;
const modalRoot = document.getElementById('modalRoot');

function openModal(html) {
  lastFocused = document.activeElement;
  modalRoot.innerHTML = `<div class="modal-overlay" role="presentation">${html}</div>`;
  const overlay = modalRoot.querySelector('.modal-overlay');
  const panel = overlay.querySelector('[role="dialog"]');
  // focus first focusable
  const focusables = () => panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  const first = focusables()[0];
  if (first) first.focus();

  function onKey(e) {
    if (e.key === 'Escape') { closeModal(); }
    if (e.key === 'Tab') {
      const f = Array.from(focusables()).filter(el=>!el.disabled && el.offsetParent !== null);
      if (!f.length) return;
      const fi = f[0], la = f[f.length-1];
      if (e.shiftKey && document.activeElement === fi) { e.preventDefault(); la.focus(); }
      else if (!e.shiftKey && document.activeElement === la) { e.preventDefault(); fi.focus(); }
    }
  }
  overlay.addEventListener('keydown', onKey);
  overlay.addEventListener('mousedown', (e)=>{ if (e.target === overlay) closeModal(); });
}
function closeModal() {
  modalRoot.innerHTML = '';
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

function modalShell(id, title, bodyHTML, footerHTML) {
  return `<div class="modal-panel w-full max-w-2xl rounded-2xl shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="${id}-title" style="background:var(--card)">

      <div>
        <label class="sr-only" for="li-desc-${idx}">Description for line ${idx+1}</label>
        <input id="li-desc-${idx}" data-idx="${idx}" data-f="description" type="text" value="${li.description.replace(/"/g,'&quot;')}" placeholder="Description" class="li-input w-full bg-card border rounded-lg px-2 py-1.5 text-sm" style="border-color:var(--line)">
      </div>
      <div>
        <label class="sr-only" for="li-qty-${idx}">Quantity for line ${idx+1}</label>
        <input id="li-qty-${idx}" data-idx="${idx}" data-f="qty" type="number" min="1" value="${li.qty}" class="li-input w-full bg-card border rounded-lg px-2 py-1.5 text-sm" style="border-color:var(--line)">
      </div>
      <div>
        <label class="sr-only" for="li-price-${idx}">Unit price (Rand) for line ${idx+1}</label>
        <input id="li-price-${idx}" data-idx="${idx}" data-f="unitPrice" type="number" min="0" step="0.01" value="${(li.unitPrice/100)}" class="li-input w-full bg-card border rounded-lg px-2 py-1.5 text-sm" style="border-color:var(--line)">
      </div>
      <button type="button" data-rm="${idx}" class="rm-item p-1.5 rounded-lg" aria-label="Remove line ${idx+1}" style="color:var(--clay)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
    </div>`).join('');
  wrap.querySelectorAll('.li-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.idx, f = e.target.dataset.f;
      let val = e.target.value;
      if (f==='qty') val = Math.max(1, parseInt(val||'1'));
      else if (f==='unitPrice') val = Math.round(parseFloat(val||'0')*100);
      quoteDraft.items[i][f] = val;
      recalcQuote();
    });
  });
  wrap.querySelectorAll('.rm-item').forEach(btn=>{
    btn.addEventListener('click', e=>{
      quoteDraft.items.splice(+e.currentTarget.dataset.rm,1);
      if (!quoteDraft.items.length) quoteDraft.items.push({description:'',qty:1,unitPrice:0});
      renderQuoteItems(); recalcQuote();
    });
  });
}
function recalcQuote() {
  const disc = Math.round(parseFloat(document.getElementById('quoteDiscount').value||'0')*100);
  const vat = document.getElementById('quoteVat').checked;
  quoteDraft.discount = disc; quoteDraft.vat = vat;
  const t = computeTotals(quoteDraft.items, disc, vat);
  document.getElementById('quoteTotals').innerHTML = `
    <div class="flex justify-between"><span style="color:var(--muted)">Subtotal</span><span class="tabular-nums">${fmt(t.subtotal)}</span></div>
    <div class="flex justify-between"><span style="color:var(--muted)">Discount</span><span class="tabular-nums">−${fmt(t.discount)}</span></div>
    <div class="flex justify-between"><span style="color:var(--muted)">VAT</span><span class="tabular-nums">${fmt(t.vat)}</span></div>
    <div class="flex justify-between font-bold text-base mt-1 pt-1" style="border-top:1px solid var(--line)"><span>Total</span><span class="tabular-nums">${fmt(t.total)}</span></div>`;
}
async function submitQuote(e) {
  const id = e.currentTarget.dataset.id;
  const valid = quoteDraft.items.filter(li=>li.description.trim() && li.qty>0 && li.unitPrice>0);
  clearError('quoteItemsErr');
  if (!valid.length) {
    showError('quoteItemsErr','Add at least one line item with a description and a positive amount.');
    document.querySelector('#lineItemsWrap input')?.focus();
    return;
  }
  const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Sending…';
  const t = computeTotals(valid, quoteDraft.discount, quoteDraft.vat);
  await mockApi(`/api/admin/bookings/${id}/quote`, {items:valid, total:t.total});
  const b = state.bookings.find(x=>x.id===id);
  const nextV = (b.quoteHistory[b.quoteHistory.length-1]?.version||0)+1;
  b.quoteHistory.forEach(q=>q.active=false);
  const newHistory = [...b.quoteHistory, {version:nextV, date:isoDate(today), total:t.total, active:true, pdfLink:'#quote-v'+nextV}];
  closeModal();
  updateBooking(id, { lineItems:valid, quotedAmount:t.total, status:'QUOTED', invoiceExists:true, quoteHistory:newHistory });
  announce(`Quote sent to ${b.client}. Booking ${id} is now quoted.`);
}

/* ---- Record Payment Modal ---- */
function openPaymentModal(b) {
  const out = outstanding(b);
  const body = `
    <div class="space-y-4">
      <div class="rounded-xl p-3 text-sm flex justify-between" style="background:var(--paper)">
        <span style="color:var(--muted)">Outstanding balance</span>
        <strong class="tabular-nums">${fmt(out)}</strong>
      </div>
      <div>
        <label for="payAmount" class="block text-xs font-semibold uppercase tracking-wide mb-1" style="color:var(--muted)">Amount (R) <span style="color:var(--clay)" aria-hidden="true">*</span></label>
        <input id="payAmount" type="number" min="0.01" step="0.01" value="${(out/100).toFixed(2)}" aria-required="true" aria-describedby="payAmountErr" class="w-full bg-card border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
        ${fieldError('payAmountErr')}
      </div>
      <div>
        <label for="payStatus" class="block text-xs font-semibold uppercase tracking-wide mb-1" style="color:var(--muted)">Resulting payment status</label>
        <select id="payStatus" class="w-full bg-card border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          <option value="PAID">Paid in full</option>
          <option value="DEPOSIT_PAID" selected>Deposit paid</option>
          <option value="UNPAID">Unpaid</option>
          <option value="FAILED">Failed</option>
        </select>
      </div>
      <div>
        <label for="payRef" class="block text-xs font-semibold uppercase tracking-wide mb-1" style="color:var(--muted)">Reference / notes</label>
        <input id="payRef" type="text" placeholder="e.g. EFT-12345" class="w-full bg-card border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
      </div>
    </div>`;
  const footer = `
    <button type="button" data-close class="px-4 py-2 text-sm font-semibold rounded-lg border" style="border-color:var(--line)">Cancel</button>
    <button type="button" id="savePayBtn" data-id="${b.id}" class="px-5 py-2 text-sm font-semibold rounded-lg" style="background:var(--ink); color:var(--paper)">Record payment</button>`;
  openModal(modalShell('pay','Record payment', body, footer));
  document.getElementById('savePayBtn').addEventListener('click', async (e)=>{
    const id = e.currentTarget.dataset.id;
    const b2 = state.bookings.find(x=>x.id===id);
    const out2 = outstanding(b2);
    const amt = Math.round(parseFloat(document.getElementById('payAmount').value||'0')*100);
    clearError('payAmountErr');
    if (!amt || amt<=0) { showError('payAmountErr','Enter an amount greater than zero.'); document.getElementById('payAmount').focus(); return; }
    if (amt > out2) { showError('payAmountErr',`Amount cannot exceed the outstanding balance of ${fmt(out2)}.`); document.getElementById('payAmount').focus(); return; }
    const payStatus = document.getElementById('payStatus').value;
    const ref = document.getElementById('payRef').value.trim() || 'REF-'+Math.floor(Math.random()*90000+10000);
    const btn = e.currentTarget; btn.disabled=true; btn.textContent='Saving…';
    await mockApi(`/api/admin/bookings/${id}/payment`, {amount:amt, payStatus, ref});
    const newTxns = [...b2.transactions, {date:isoDate(today), type: payStatus==='PAID'?'Balance':'Payment', amount:amt, reference:ref}];
    closeModal();
    updateBooking(id, { amountPaid: b2.amountPaid+amt, paymentStatus:payStatus, lastPaymentDate:isoDate(today), lastPaymentReference:ref, transactions:newTxns });
    announce(`Payment of ${fmt(amt)} recorded for booking ${id}.`);
  });
}

        <input id="cancelReason" type="text" aria-required="true" aria-describedby="cancelReasonErr" class="w-full bg-card border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">

      </div>

          <input id="cancelBy" type="text" aria-required="true" aria-describedby="cancelByErr" class="w-full bg-card border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          ${fieldError('cancelByErr')}
        </div>
        <div>
          <label for="cancelRefund" class="block text-xs font-semibold uppercase tracking-wide mb-1" style="color:var(--muted)">Refund amount (R)</label>
          <input id="cancelRefund" type="number" min="0" step="0.01" value="0" aria-describedby="cancelRefundErr" class="w-full bg-card border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          ${fieldError('cancelRefundErr')}
        </div>
      </div>
      <div>
        <label for="cancelNotes" class="block text-xs font-semibold uppercase tracking-wide mb-1" style="color:var(--muted)">Internal notes</label>
        <textarea id="cancelNotes" rows="2" class="w-full bg-card border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)"></textarea>
      </div>
    </div>`;
  const footer = `
    <button type="button" data-close class="px-4 py-2 text-sm font-semibold rounded-lg border" style="border-color:var(--line)">Keep booking</button>
    <button type="button" id="confirmCancelBtn" data-id="${b.id}" class="px-5 py-2 text-sm font-semibold rounded-lg" style="background:var(--clay); color:#fff">Cancel booking</button>`;
  openModal(modalShell('cancel','Cancel booking', body, footer));
  document.getElementById('confirmCancelBtn').addEventListener('click', async (e)=>{
    const id = e.currentTarget.dataset.id;
    const b2 = state.bookings.find(x=>x.id===id);
    const reason = document.getElementById('cancelReason').value.trim();
    const by = document.getElementById('cancelBy').value.trim();
    const refund = Math.round(parseFloat(document.getElementById('cancelRefund').value||'0')*100);
    ['cancelReasonErr','cancelByErr','cancelRefundErr'].forEach(clearError);
    let bad = false;
    if (!reason) { showError('cancelReasonErr','A reason is required.'); bad=true; }
    if (!by) { showError('cancelByErr','Enter who is cancelling.'); bad=true; }
    if (refund > b2.amountPaid) { showError('cancelRefundErr',`Refund cannot exceed ${fmt(b2.amountPaid)} already paid.`); bad=true; }
    if (bad) { document.querySelector('[role="alert"]:not([hidden])')?.previousElementSibling?.focus?.(); return; }
    const btn = e.currentTarget; btn.disabled=true; btn.textContent='Cancelling…';
    await mockApi(`/api/admin/bookings/${id}/cancel`, {reason,by,refund});
    closeModal();
    updateBooking(id, { status:'CANCELLED', promoted:false, cancellation:{reason,by,refund,notes:document.getElementById('cancelNotes')?.value||''} });
    announce(`Booking ${id} cancelled. A cancellation email has been sent to ${b2.client}.`);
  });
}

/* ---- Contract / Full details modals ---- */
function openContractModal(b) {
  const cs = b.contract.state;
  const label = {draft:'Draft',sent:'Sent to client',signed:'Signed'}[cs];
  const body = `<div class="space-y-3">
    <p class="text-sm">Current state: <strong>${label}</strong></p>
    ${b.contract.signerName?`<p class="text-sm" style="color:var(--muted)">Signed by ${b.contract.signerName} on ${b.contract.signedDate}.</p>`:''}
    <p class="text-sm" style="color:var(--muted)">Manage the contract lifecycle below. (Mock — generates no real document.)</p>
  </div>`;
  const acts = b.status==='CANCELLED' ? '' :
    cs==='draft' ? `<button type="button" id="ctSend" data-id="${b.id}" class="px-5 py-2 text-sm font-semibold rounded-lg" style="background:var(--ink); color:var(--paper)">Send to client</button>` :
    cs==='sent'  ? `<button type="button" id="ctSign" data-id="${b.id}" class="px-5 py-2 text-sm font-semibold rounded-lg" style="background:var(--sage); color:#fff">Mark signed</button>` : '';
  const footer = `<button type="button" data-close class="px-4 py-2 text-sm font-semibold rounded-lg border" style="border-color:var(--line)">Close</button>${acts}`;
  openModal(modalShell('contract','Contract management', body, footer));
  document.getElementById('ctSend')?.addEventListener('click', async (e)=>{
    const id=e.currentTarget.dataset.id; await mockApi(`/api/admin/bookings/${id}/contract/send`);
    const bb=state.bookings.find(x=>x.id===id); closeModal();
    updateBooking(id,{contract:{...bb.contract,state:'sent'}}); announce('Contract sent to client.');
  });
  document.getElementById('ctSign')?.addEventListener('click', async (e)=>{
    const id=e.currentTarget.dataset.id; await mockApi(`/api/admin/bookings/${id}/contract/sign`);
    const bb=state.bookings.find(x=>x.id===id); closeModal();
    updateBooking(id,{contract:{state:'signed',signerName:bb.client,signedDate:isoDate(today)}}); announce('Contract marked as signed.');
  });
}

          <input id="nbEmail" type="email" aria-required="true" aria-describedby="nbEmailErr" class="w-full bg-card border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">

/* ---- Delete confirm ---- */
function openDeleteModal(b) {
  const body = `<p class="text-sm">Permanently remove <strong>${b.id} — ${b.event}</strong> from the local list? This cannot be undone in this demo.</p>`;
  const footer = `<button type="button" data-close class="px-4 py-2 text-sm font-semibold rounded-lg border" style="border-color:var(--line)">Keep</button>
    <button type="button" id="confirmDelBtn" data-id="${b.id}" class="px-5 py-2 text-sm font-semibold rounded-lg" style="background:var(--clay); color:#fff">Delete</button>`;
  openModal(modalShell('del','Delete booking', body, footer));
  document.getElementById('confirmDelBtn').addEventListener('click', (e)=>{
    const id = e.currentTarget.dataset.id;
    state.bookings = state.bookings.filter(x=>x.id!==id);
    delete state.detailCache[id];
    if (state.expandedId===id) state.expandedId=null;
    closeModal(); render(); announce(`Booking ${id} deleted.`);
  });
}

/* =========================================================================
   EVENT DELEGATION
   ========================================================================= */
document.addEventListener('click', (e)=>{
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn) { closeModal(); return; }

  const expandBtn = e.target.closest('.expand-btn');
  if (expandBtn) { toggleExpand(expandBtn.dataset.id); return; }

  const pill = e.target.closest('.stat-pill');
  if (pill) {
    const s = pill.dataset.status;
    state.filters.status = state.filters.status === s ? null : s;
    render();
    announce(state.filters.status ? `Filtered to ${STATUS_META[s].label} bookings.` : 'Status filter cleared.');
    return;
  }

  const act = e.target.closest('[data-action]');
  if (act) {
    const id = act.dataset.id;
    const b = state.bookings.find(x=>x.id===id);
    if (!b && act.dataset.action!=='clear') return;
    switch(act.dataset.action) {
      case 'quote': openQuoteModal(b); break;
      case 'payment': openPaymentModal(b); break;
      case 'cancel': openCancelModal(b); break;
      case 'contract': openContractModal(b); break;
      case 'details': toggleExpand(id); break;
      case 'delete': openDeleteModal(b); break;
      case 'invoice': mockApi(`/api/admin/bookings/${id}/invoice`).then(()=>{updateBooking(id,{invoiceExists:true}); announce(`Invoice generated for booking ${id}.`);}); break;
      case 'accept': mockApi(`/api/admin/bookings/${id}/accept`).then(()=>{updateBooking(id,{status:'ACCEPTED'}); announce(`Booking ${id} accepted.`);}); break;
      case 'confirm': mockApi(`/api/admin/bookings/${id}/confirm`).then(()=>{updateBooking(id,{status:'CONFIRMED'}); announce(`Booking ${id} confirmed.`);}); break;
      case 'complete': mockApi(`/api/admin/bookings/${id}/complete`).then(()=>{updateBooking(id,{status:'COMPLETED'}); announce(`Booking ${id} marked complete.`);}); break;
      case 'togglePromo': {
        const np = !b.promoted;
        mockApi(`/api/admin/bookings/${id}/promote`, {is_public:np}).then(()=>{updateBooking(id,{promoted:np}); announce(np?`Booking ${id} is now publicly promoted.`:`Booking ${id} removed from public promotion.`);});
        break;
      }
      case 'linkVenue': {
        const sel = document.getElementById('venueSel-'+id);
        if (sel) mockApi(`/api/admin/bookings/${id}/venue`, {venueId:sel.value}).then(()=>{updateBooking(id,{venueId:sel.value}); announce('Venue linked.');});
        break;
      }
      case 'sendContract': mockApi(`/api/admin/bookings/${id}/contract/send`).then(()=>{updateBooking(id,{contract:{...b.contract,state:'sent'}}); announce('Contract sent.');}); break;
      case 'markSigned': mockApi(`/api/admin/bookings/${id}/contract/sign`).then(()=>{updateBooking(id,{contract:{state:'signed',signerName:b.client,signedDate:isoDate(today)}}); announce('Contract signed.');}); break;
    }
  }
});

document.getElementById('newBookingBtn').addEventListener('click', openNewBookingModal);
document.getElementById('paymentFilter').addEventListener('change', (e)=>{
  state.filters.payment = e.target.value; render();
});
document.getElementById('clearFilters').addEventListener('click', ()=>{
  state.filters = { status:null, payment:'All' };
  document.getElementById('paymentFilter').value = 'All';
  render(); announce('All filters cleared.');
});

/* =========================================================================
   INIT
   ========================================================================= */
seed();
render();
</script>
