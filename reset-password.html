<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Management Dashboard | Reset Password</title>
    <!-- Bootstrap Core CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Specific page override to match the admin login styling strictly */
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: #111; }
        body.login-page-bg {
            background-image: url('images/slider/image-slider-1.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>

<body class="admin-body login-page-bg">

    <div id="resetSection" class="container admin-layout" style="margin-top: 50px; text-align: center; max-width: 400px;">
        <div class="admin-card text-left" style="background: rgba(34, 34, 34, 0.5); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.1);">
            <div style="text-align: center; margin-bottom: 20px;">
                <a href="index.html"><img src="images/logo4.png" style="max-height: 80px;" alt="Thabiso Mhlongo Logo"></a>
            </div>
            <h3 style="margin-top: 0; text-align: center;">Secure Password Reset</h3>
            <p style="text-align: center; font-size: 13px; color: #ccc;">Enter your new password below.</p>
            <hr>
            
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" class="form-control" required autofocus minlength="8" placeholder="Min 8 characters">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required minlength="8">
                </div>
                <div id="resetMessage" class="alert" style="display: none; padding: 10px; margin-top: 10px; font-size: 13px;"></div>
                <button type="submit" id="resetBtn" class="btn btn-warning btn-block" style="background:#D4AF37; color:#222; font-weight:bold; border:none; padding:10px; margin-top: 20px; transition:0.3s;" onmouseover="this.style.background='#fff';" onmouseout="this.style.background='#D4AF37';">Update Password</button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="admin.html" style="color: #aaa; font-size: 13px; text-decoration: underline;"><i class="fa fa-arrow-left"></i> Return to Login</a>
                </div>
            </form>
        </div>
    </div>

    <!-- jQuery -->
    <script src="js/jquery.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Extract URL Parameters securely
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');
            
            const msgBox = document.getElementById('resetMessage');
            const btn = document.getElementById('resetBtn');

            // 2. Validate token existence early to prevent confusion
            if (!token || !email) {
                msgBox.className = "alert alert-danger";
                msgBox.innerText = "Invalid or missing password reset link. Please request a new one from the admin page.";
                msgBox.style.display = 'block';
                document.getElementById('newPassword').disabled = true;
                document.getElementById('confirmPassword').disabled = true;
                btn.disabled = true;
                return;
            }

            // 3. Handle Form Submission
            document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword !== confirmPassword) {
                    msgBox.className = "alert alert-danger";
                    msgBox.innerText = "Passwords do not match!";
                    msgBox.style.display = 'block';
                    return;
                }
                
                if (newPassword.length < 8) {
                    msgBox.className = "alert alert-danger";
                    msgBox.innerText = "Password must be at least 8 characters.";
                    msgBox.style.display = 'block';
                    return;
                }

                btn.disabled = true;
                btn.innerText = "Updating...";
                msgBox.style.display = 'none';

                try {
                    const response = await fetch('/api/admin/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, token, newPassword })
                    });
                    
                    const result = await response.json();

                    msgBox.className = result.success ? "alert alert-success" : "alert alert-danger";
                    msgBox.innerText = result.message;
                    msgBox.style.display = 'block';

                    if (result.success) {
                        btn.style.display = 'none';
                        setTimeout(() => {
                            window.location.href = "admin.html";
                        }, 2500); // Redirect to login page after success
                    } else {
                        btn.disabled = false;
                        btn.innerText = "Update Password";
                    }
                } catch (err) {
                    console.error("Reset password error", err);
                    msgBox.className = "alert alert-danger";
                    msgBox.innerText = "Error completing the request. Please try again.";
                    msgBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = "Update Password";
                }
            });
        });
    </script>
</body>
</html>
